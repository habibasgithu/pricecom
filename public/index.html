<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PriceScout — Compare Products Everywhere</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PriceScout</h1>
    <p>Search a product by name or photo — compare it across Amazon, eBay, Walmart & Temu.</p>
  </header>

  <main>
    <form id="searchForm">
      <input type="text" id="queryInput" placeholder="e.g. wireless earbuds" />
      <label class="photo-btn">
        📷 Upload photo
        <input type="file" id="photoInput" accept="image/*" hidden />
      </label>
      <button type="submit">Search</button>
    </form>

    <div id="previewWrap"></div>
    <div id="status"></div>
    <div id="results" class="grid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
